                    type: integer
                  number:
                    type: integer
                  results:
                    type: array
                    uniqueItems: true
                    minItems: 0
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                          minLength: 1
                        image:
                          type: string
                          minLength: 1
                        imageType:
                          type: string
                          minLength: 1
                      required:
                      - id
                      - title
                      - image
                      - imageType
                  totalResults:
                    type: integer
                required:
                - offset
                - number
                - results
                - totalResults
              examples:
                example-1:
                  value:
                    offset: 0
                    number: 2
                    results:
                    - id: 716429
                      title: Pasta with Garlic, Scallions, Cauliflower & Breadcrumbs
                      calories: 584
                      carbs: 84g
                      fat: 20g
                      image: https://spoonacular.com/recipeImages/716429-312x231.jpg
                      imageType: jpg
                      protein: 19g
                    - id: 715538
                      title: What to make for dinner tonight?? Bruschetta Style Pork & Pasta
                      calories: 521
                      carbs: 69g
                      fat: 10g
                      image: https://spoonacular.com/recipeImages/715538-312x231.jpg
                      imageType: jpg
                      protein: 35g
                    totalResults: 86
