  /food/customFoods/search:
    get:
      responses:
        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  customFoods:
                    type: array
                    uniqueItems: true
                    minItems: 0
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                          minLength: 1
                        servings:
                          type: number
                        imageUrl:
                          type: string
                          minLength: 1
                        price:
                          type: number
                      required:
                      - id
                      - title
                      - servings
                      - imageUrl
                      - price
                  type:
                    type: string
                    minLength: 1
                  offset:
                    type: integer
                  number:
                    type: integer
                required:
                - customFoods
                - type
                - offset
                - number
              examples:
                example-1:
                  value:
                    customFoods:
                    - id: 15
                      title: Max Cafe Curry Bratwurst
                      servings: 1
                      imageUrl: https://spoonacular.com/cdn/ingredients_100x100/bratwurst.jpg
                      price: 6.9
                    type: customFood
                    offset: 0
                    number: 10
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      parameters:
      - $ref: '#/components/parameters/query'
        example: example
      - name: username
        description: The username.
        schema:
          type: string
          example: dsky
        required: true
        style: form
        explode: false
        in: query
        example: dsky
      - name: hash
        description: The private hash for the username.
        schema:
          type: string
          example: 4b5v4398573406
        required: true
        style: form
        explode: false
        in: query
        example: 4b5v4398573406
      - $ref: '#/components/parameters/offset'
        example: example
      - $ref: '#/components/parameters/number'
        example: example
      externalDocs:
        description: Read entire docs
        url: https://spoonacular.com/food-api/docs#Search-Custom-Foods
      summary: Search Custom Foods
      description: Search custom foods in a user's account.
      operationId: searchCustomFoods
      deprecated: false
      tags:
      - Misc
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
