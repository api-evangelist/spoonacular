                      tag: ingredient
                    - annotation: cheddar
                      image: https://spoonacular.com/cdn/ingredients_100x100/cheddar-cheese.png
                      tag: ingredient
                    - annotation: tacos
                      image: https://spoonacular.com/menuItemImages/taco-isolated.jpg
                      tag: dish
                    - annotation: pizza
                      image: https://spoonacular.com/menuItemImages/cheese-pizza.png
                      tag: dish
