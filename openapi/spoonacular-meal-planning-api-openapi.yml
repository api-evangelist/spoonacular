        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  meals:
                    type: array
                    uniqueItems: true
                    minItems: 0
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                          minLength: 1
                        imageType:
                          type: string
                          minLength: 1
                        readyInMinutes:
                          type: integer
                        servings:
                          type: number
                        sourceUrl:
                          type: string
                          minLength: 1
                      required:
                      - id
                      - title
                      - imageType
                      - readyInMinutes
                      - servings
                      - sourceUrl
                  nutrients:
                    type: object
                    required:
                    - calories
                    - carbohydrates
                    - fat
                    - protein
                    properties:
                      calories:
                        type: number
                      carbohydrates:
                        type: number
                      fat:
                        type: number
                      protein:
                        type: number
                required:
                - meals
                - nutrients
              examples:
                example-1:
                  value:
                    meals:
                    - id: 655219
                      title: Peanut Butter And Chocolate Oatmeal
                      imageType: jpg
                      readyInMinutes: 45
                      servings: 1
                      sourceUrl: https://spoonacular.com/recipes/peanut-butter-and-chocolate-oatmeal-655219
                    - id: 649931
                      title: Lentil Salad With Vegetables
                      imageType: jpg
                      readyInMinutes: 45
                      servings: 4
                      sourceUrl: https://spoonacular.com/recipes/lentil-salad-with-vegetables-649931
                    - id: 632854
                      title: Asian Noodles
                      imageType: jpg
                      readyInMinutes: 45
                      servings: 4
                      sourceUrl: https://spoonacular.com/recipes/asian-noodles-632854
                    nutrients:
                      calories: 1735.81
                      carbohydrates: 235.17
                      fat: 69.22
                      protein: 55.43
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      parameters:
      - name: timeFrame
        description: Either for one "day" or an entire "week".
        schema:
          type: string
          example: day
        required: false
        style: form
        explode: false
        in: query
        example: day
      - name: targetCalories
        description: What is the caloric target for one day? The meal plan generator will try to get as close as possible to that goal.
        schema:
          type: number
          example: 2000
        required: false
        style: form
        explode: false
        in: query
        example: 2000
      - name: diet
        description: Enter a diet that the meal plan has to adhere to. See a full list of supported diets.
        schema:
          type: string
          example: vegetarian
        required: false
        style: form
        explode: false
        in: query
        example: vegetarian
      - name: exclude
        description: A comma-separated list of allergens or ingredients that must be excluded.
        schema:
          type: string
          example: shellfish, olives
        required: false
        style: form
        explode: false
        in: query
        example: shellfish, olives
      externalDocs:
        description: Read entire docs
        url: https://spoonacular.com/food-api/docs#Generate-Meal-Plan
      summary: Generate Meal Plan
      description: Generate a meal plan with three meals per day (breakfast, lunch, and dinner).
      operationId: generateMealPlan
      deprecated: false
      tags:
      - Meal Planning
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
